<style>

  /* Liquid glass border — for the nav pill + tag cards */
  .glass-edge { position: relative; isolation: isolate; }
  .glass-edge::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0.05) 35%, rgba(255,255,255,0.04) 65%, rgba(255,255,255,0.30));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);

  }
  .liquid {
    background: rgba(0,0,0,0.4);
    background-blend-mode: luminosity;
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.10);
  }
  /* Hide number input arrows */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  /* Hero headline char animation */
  .hero-char {
    display: inline-block;
    opacity: 0;
    transform: translateX(-18px);
    transition: opacity 500ms ease, transform 500ms ease;
    white-space: pre;
  }
  .hero-char.in { opacity: 1; transform: translateX(0); }
  .fade-in { opacity: 0; transition: opacity 1000ms ease, transform 1000ms ease; transform: translateY(8px); }
  .fade-in.in { opacity: 1; transform: translateY(0); }
  /* Marquee for portales */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { animation: marquee 40s linear infinite; will-change: transform; }
  /* Custom focus ring */
  .ring-terra:focus { border-color: rgba(228,178,54,0.6) !important; box-shadow: 0 0 0 3px rgba(228,178,54,0.10); outline: none; }
  /* Scroll-smooth */
  html { scroll-behavior: smooth; }
</style>
